# Continuous integration workflow for WeatherParser repository
# Runs the same local CI script as documented in CONTRIBUTING.md section 6
# For pull requests, compares against the PR base; for manual runs, uses a deliberate target
name: CI
on:
  pull_request:
    branches: [ "develop", "master" ]
    # Explicit types: every push to a pull request runs CI, including drafts (work in progress), and marking a draft ready for review starts a fresh run.
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Deliberate comparison target (commit or branch) for the coverage gate, for example the bootstrap seed 0a2dabe. Use a commit SHA or a remote branch such as origin/develop.'
        required: true
        type: string
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_UI_LANGUAGE: en
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.target_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Expose the tested commits as local branches
        shell: pwsh
        run: |
          git branch --force ci-commit $env:CI_COMMIT
          git branch --force ci-target $env:CI_TARGET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Local CI pipeline
        # bash calls pwsh -File so that the script's stage-specific exit code reaches the job result
        shell: bash
        run: pwsh -NoProfile -File ./scripts/ci-local.ps1 -Commit "$CI_COMMIT" -TargetRef "$CI_TARGET" -RunSettings coverage.runsettings
      - name: Upload run directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-windows-x64
          path: artifacts/ci/
          retention-days: 30
          if-no-files-found: warn

  ubuntu-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.target_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Expose the tested commits as local branches
        shell: pwsh
        run: |
          git branch --force ci-commit $env:CI_COMMIT
          git branch --force ci-target $env:CI_TARGET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Local CI pipeline
        # bash calls pwsh -File so that the script's stage-specific exit code reaches the job result
        shell: bash
        run: pwsh -NoProfile -File ./scripts/ci-local.ps1 -Commit "$CI_COMMIT" -TargetRef "$CI_TARGET" -RunSettings coverage.runsettings
      - name: Upload run directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-ubuntu-x64
          path: artifacts/ci/
          retention-days: 30
          if-no-files-found: warn

  debian13-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 60
    env:
      CI_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.target_ref }}
    steps:
      - name: Install system prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates tar coreutils libc-bin libicu76 libssl3t64 libgssapi-krb5-2 libstdc++6 libgcc-s1 tzdata
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Expose the tested commits as local branches
        shell: bash
        run: |
          git branch --force ci-commit "$CI_COMMIT"
          git branch --force ci-target "$CI_TARGET"
      - name: Prepare .NET SDK and PowerShell
        shell: bash
        run: bash scripts/prepare-debian-arm64.sh > "$RUNNER_TEMP/dotnet-env.sh"
      - name: Local CI pipeline
        shell: bash
        run: |
          . "$RUNNER_TEMP/dotnet-env.sh"
          pwsh ./scripts/ci-local.ps1 -Commit "$CI_COMMIT" -TargetRef "$CI_TARGET" -RunSettings coverage.runsettings
      - name: Upload run directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-debian13-arm64
          path: artifacts/ci/
          retention-days: 30
          if-no-files-found: warn
